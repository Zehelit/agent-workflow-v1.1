name: Agent Browser iOS Safari smoke

on:
  push:
    branches: [agwf-agent-browser-platform-test]

permissions:
  contents: read

jobs:
  ios-safari:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Read an open demo catalog in Mobile Safari
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/agwf-ios.XXXXXX")"
          export APPIUM_HOME="$root/appium"
          export AGENT_BROWSER_SOCKET_DIR="$root/run"
          node --version
          uname -m
          xcodebuild -version
          npm install --prefix "$root" --no-audit --no-fund agent-browser@0.43.0 appium@3.0.0
          export PATH="$root/node_modules/.bin:$PATH"
          agent-browser --version
          appium driver install xcuitest@10.13.1
          device_name="AGWF Safari Fixture $GITHUB_RUN_ID"
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          device_type=com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro
          device="$(xcrun simctl create "$device_name" "$device_type" "$runtime")"
          export AGENT_BROWSER_PROVIDER=ios
          export AGENT_BROWSER_IOS_DEVICE="$device_name"
          ab() { agent-browser --session platform-ios --provider ios --device "$device_name" --json "$@"; }
          appium_pid=""
          wda_build_pid=""
          wda_server_pid=""
          cleanup() {
            result="$?"
            trap - EXIT
            if [ -n "$wda_build_pid" ]; then
              kill "$wda_build_pid" 2>/dev/null || true
              wait "$wda_build_pid" 2>/dev/null || true
            fi
            if [ "$result" -ne 0 ] && [ -f "$root/wda-build.log" ]; then
              tail -n 70 "$root/wda-build.log"
            fi
            if [ "$result" -ne 0 ] && [ -f "$root/appium.log" ]; then
              tail -n 100 "$root/appium.log"
            fi
            if [ "$result" -ne 0 ] && [ -f "$root/wda-server.log" ]; then
              tail -n 100 "$root/wda-server.log"
            fi
            if [ "$result" -ne 0 ]; then ab close || true; fi
            if [ -n "$wda_server_pid" ]; then
              kill "$wda_server_pid" 2>/dev/null || true
              wait "$wda_server_pid" 2>/dev/null || true
            fi
            if [ -n "$appium_pid" ]; then
              kill "$appium_pid" 2>/dev/null || true
              wait "$appium_pid" 2>/dev/null || true
            fi
            xcrun simctl shutdown "$device" 2>/dev/null || true
            xcrun simctl delete "$device" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          ab device list | python3 -c 'import json,sys; r=json.load(sys.stdin); match=[d for d in r["data"]["devices"] if d["udid"]==sys.argv[1]]; assert len(match)==1 and not match[0]["isReal"]; print("AGWF_IOS_SIMULATOR",match[0]["name"],match[0]["runtime"])' "$device"
          date -u '+AGWF_IOS_APPIUM_START %FT%TZ'
          wda_project="$(python3 -c 'import pathlib,sys; xs=list(pathlib.Path(sys.argv[1]).glob("**/appium-webdriveragent/WebDriverAgent.xcodeproj")); assert len(xs)==1, xs; print(xs[0])' "$APPIUM_HOME/node_modules")"
          defaults='{"appium:webDriverAgentUrl":"http://127.0.0.1:8100","appium:platformVersion":"18.5"}'
          appium --address 127.0.0.1 --port 4723 --default-capabilities "$defaults" >"$root/appium.log" 2>&1 &
          appium_pid="$!"
          date -u '+AGWF_IOS_BOOT_BEGIN %FT%TZ'
          xcrun simctl boot "$device"
          date -u '+AGWF_IOS_WDA_BUILD_BEGIN %FT%TZ'
          xcodebuild build-for-testing -project "$wda_project" -scheme WebDriverAgentRunner \
            -destination "platform=iOS Simulator,id=$device" -derivedDataPath "$root/wda" \
            CODE_SIGNING_ALLOWED=NO >"$root/wda-build.log" 2>&1 &
          wda_build_pid="$!"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices --json | python3 -c 'import json,sys; devices=[d for ds in json.load(sys.stdin)["devices"].values() for d in ds]; match=[d for d in devices if d["udid"]==sys.argv[1]]; print("AGWF_IOS_DEVICE_STATE",len(match),[d["state"] for d in match],flush=True); assert len(match)==1 and match[0]["state"]=="Booted"; print("AGWF_IOS_BOOTED",match[0]["name"])' "$device"
          deadline=$((SECONDS + 135))
          until curl --silent --fail --max-time 2 http://127.0.0.1:4723/status | python3 -c 'import json,sys; data=sys.stdin.read(); sys.exit(0 if data and json.loads(data)["value"]["ready"] else 1)'; do
            kill -0 "$appium_pid"
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Appium readiness timed out'; exit 1; fi
            sleep 1
          done
          date -u '+AGWF_IOS_APPIUM_READY %FT%TZ'
          wait "$wda_build_pid"
          wda_build_pid=""
          grep -F '** TEST BUILD SUCCEEDED **' "$root/wda-build.log"
          python3 -c 'import pathlib,sys; root=pathlib.Path(sys.argv[1]); assert list(root.glob("Build/Products/*.xctestrun")), "No Xcode test-run manifest"; assert list(root.glob("Build/Products/**/WebDriverAgentRunner-Runner.app")), "No simulator WebDriverAgent app"; print("AGWF_IOS_WDA_PREBUILT")' "$root/wda"
          test_run="$(python3 -c 'import pathlib,sys; files=list(pathlib.Path(sys.argv[1]).glob("Build/Products/*.xctestrun")); assert len(files)==1, files; print(files[0])' "$root/wda")"
          date -u '+AGWF_IOS_WDA_SERVER_START %FT%TZ'
          USE_PORT=8100 xcodebuild -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            test-without-building >"$root/wda-server.log" 2>&1 &
          wda_server_pid="$!"
          deadline=$((SECONDS + 300))
          until curl --silent --fail --max-time 2 http://127.0.0.1:8100/status | python3 -c 'import json,sys; raw=sys.stdin.read(); sys.exit(0 if raw and json.loads(raw)["value"].get("ready") is True else 1)'; do
            kill -0 "$wda_server_pid"
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'WebDriverAgent readiness timed out'; exit 1; fi
            sleep 2
          done
          date -u '+AGWF_IOS_WDA_SERVER_READY %FT%TZ'
          # The CLI gives a cold navigation 30 seconds. Use the same daemon action
          # with a longer receive deadline on this run's private socket.
          test -S "$AGENT_BROWSER_SOCKET_DIR/platform-ios.sock"
          date -u '+AGWF_IOS_DAEMON_NAVIGATION_BEGIN %FT%TZ'
          python3 - "$AGENT_BROWSER_SOCKET_DIR/platform-ios.sock" "$device_name" <<'PY'
          import json
          import socket
          import sys
          import time

          catalog = "https://books.toscrape.com/"
          request = {
              "id": "agwf-ios-catalog-open",
              "action": "navigate",
              "url": catalog,
              "waitUntil": "none",
              "iosDevice": sys.argv[2],
              "settings": {"provider": "ios"},
          }
          start = time.monotonic()
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as client:
              client.settimeout(240)
              client.connect(sys.argv[1])
              client.sendall((json.dumps(request) + "\n").encode())
              with client.makefile("rb") as incoming:
                  response = json.loads(incoming.readline(1048576))
          print("AGWF_IOS_DAEMON_NAVIGATION_SECONDS", round(time.monotonic() - start, 2))
          print(json.dumps(response), flush=True)
          assert response["success"] and response["data"]["url"] == catalog, response
          assert response["data"]["lifecycle"]["effectiveLaunch"]["engine"] == "safari", response
          PY
          date -u '+AGWF_IOS_NAVIGATED %FT%TZ'
          ab get url | python3 -c 'import json,sys; result=json.load(sys.stdin); print(json.dumps(result)); assert result["success"] and result["data"]["url"]=="https://books.toscrape.com/"'
          selector='a[href$="/travel_2/index.html"]'
          home="$(ab eval 'return {heading:document.querySelector("h1")?.textContent.trim(), matches:[...document.links].filter(a=>a.href.endsWith("/travel_2/index.html")).length, userAgent:navigator.userAgent};')"
          printf '%s\n' "$home"
          printf '%s\n' "$home" | python3 -c 'import json,sys; v=json.load(sys.stdin)["data"]["result"]; assert v["heading"]=="All products" and v["matches"]==1 and "iPhone" in v["userAgent"] and "Safari" in v["userAgent"]'
          ab click "$selector"
          category="$(ab eval 'return {heading:document.querySelector("h1")?.textContent.trim(), products:document.querySelectorAll("article.product_pod").length, path:location.pathname};')"
          printf '%s\n' "$category"
          printf '%s\n' "$category" | python3 -c 'import json,sys; v=json.load(sys.stdin)["data"]["result"]; assert v["heading"]=="Travel" and v["products"]>0 and v["path"]=="/catalogue/category/books/travel_2/index.html"'
          ab screenshot "$root/travel.png"
          python3 -c 'import hashlib,pathlib,struct,sys; d=pathlib.Path(sys.argv[1]).read_bytes(); assert d[:8] == bytes.fromhex("89504e470d0a1a0a"); w,h=struct.unpack(">II",d[16:24]); assert w>0 and h>0; print("AGWF_IOS_PNG",w,h,hashlib.sha256(d).hexdigest())' "$root/travel.png"
          printf 'AGWF_IOS_PNG=%s\n' "$root/travel.png" >>"$GITHUB_ENV"
          echo 'AGWF_IOS_PROBE snapshot'
          ab snapshot -i || true
          echo 'AGWF_IOS_PROBE get-text'
          ab get text 'h1' || true
          echo 'AGWF_IOS_PROBE find-text'
          ab find text Travel click --exact || true
          echo 'AGWF_IOS_WARM_CLI_OPEN'
          ab open https://books.toscrape.com/catalogue/category/books/travel_2/index.html
          echo 'AGWF_IOS_SWIPE_SETUP'
          ab eval 'window.scrollTo(0,0); window.agwfSwipe={touchstart:0,touchmove:0,touchend:0}; for (const type of Object.keys(window.agwfSwipe)) document.addEventListener(type,()=>window.agwfSwipe[type]++,{capture:true,passive:true}); return {scroll:window.scrollY,innerHeight:innerHeight,contentHeight:document.documentElement.scrollHeight};'
          echo 'AGWF_IOS_SWIPE_COMMAND'
          ab swipe up 275 || true
          sleep 1
          echo 'AGWF_IOS_SWIPE_RESULT'
          ab eval 'return {scroll:window.scrollY,events:window.agwfSwipe};'
          echo 'AGWF_IOS_TAP_SETUP'
          tap_probe="$(cat <<'JS'
          const surface = document.createElement("div");
          surface.id = "agwf-gesture-surface";
          surface.style.cssText = "position:fixed;inset:0;z-index:2147483640;background:#fafafa";
          const target = document.createElement("button");
          target.id = "agwf-visible-target";
          target.textContent = "Confirm mobile selection";
          target.style.cssText = "position:absolute;left:16px;top:24px;width:120px;height:54px";
          surface.append(target);
          document.body.append(surface);
          window.agwfTap = {target:0, surface:0, last:null};
          surface.addEventListener("click", (event) => {
            window.agwfTap[event.target === target ? "target" : "surface"]++;
            window.agwfTap.last = {target:event.target.id, x:event.clientX, y:event.clientY, trusted:event.isTrusted};
          });
          const {x,y,width,height} = target.getBoundingClientRect();
          return {x,y,width,height};
          JS
          )"
          ab eval "$tap_probe"
          echo 'AGWF_IOS_TAP_COMMAND'
          ab tap '#agwf-visible-target' || true
          echo 'AGWF_IOS_TAP_RESULT'
          ab eval 'return window.agwfTap;'
          ab close
      - name: Preserve the verified Mobile Safari screenshot
        if: ${{ !cancelled() && env.AGWF_IOS_PNG != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agwf-mobile-safari-travel
          path: ${{ env.AGWF_IOS_PNG }}
          if-no-files-found: error
          retention-days: 1
